name: Desplegar API

# Se publica una versión con: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  test:
    name: Tests (motor + API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tb
          POSTGRES_PASSWORD: tb
          POSTGRES_DB: touched_block_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tb -d touched_block_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://tb:tb@localhost:5432/touched_block_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile --filter "@tb/api..."

      - name: Compilar y probar el motor
        run: |
          pnpm --filter @tb/engine build
          pnpm --filter @tb/engine test

      - name: Compilar la API
        run: pnpm --filter @tb/api build

      - name: Tests unitarios de la API
        run: pnpm --filter @tb/api test

      - name: Tests e2e de la API
        run: pnpm --filter @tb/api test:e2e

  deploy:
    name: Imagen en GHCR y despliegue en Dokploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/touched-block-api" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Dokploy corre deploy/docker-compose.yml (API + Postgres); con pull_policy: always baja la :latest recién publicada
      - name: Desplegar en Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "::error::Faltan los secretos DOKPLOY_URL, DOKPLOY_API_KEY o DOKPLOY_COMPOSE_ID (ver docs/despliegue.md)"
            exit 1
          fi
          curl -fsS -X POST "${DOKPLOY_URL%/}/api/compose.deploy" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "{\"composeId\":\"${DOKPLOY_COMPOSE_ID}\",\"title\":\"${GITHUB_REF_NAME}\"}"
          echo
          echo "Despliegue de ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }} solicitado a Dokploy."
