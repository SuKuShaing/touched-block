name: Publicar la redirección en GitHub Pages

# La web vieja (https://sukushaing.github.io/touched-block/) ya no tiene el juego: solo una página
# que lleva a https://web.touchedblock.app conservando ruta y parámetros, y le pasa al sitio nuevo
# los datos locales del jugador (récord, historial, sesión…). Ver deploy/gh-pages-redirect/ y
# docs/despliegue.md. El juego se publica en Cloudflare con deploy-web.yml.
on:
  push:
    branches: [main]
    paths:
      - 'deploy/gh-pages-redirect/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 404.html = index.html: así cualquier ruta vieja (/touched-block/como-jugar?nivel=basico…)
      # cae en la misma página de redirección. Se copia aquí para que nunca queden distintas.
      - name: Preparar sitio
        run: |
          cd deploy/gh-pages-redirect
          cp index.html 404.html
          touch .nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/gh-pages-redirect

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
