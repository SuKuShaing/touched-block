    <!-- Los archivos de public/ se copian a la raíz del export; el sitio vive bajo experiments.baseUrl (/touched-block). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/touched-block/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/touched-block/favicon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/touched-block/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/touched-block/apple-touch-icon.png" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #12121a;
        color: #fff;
        overflow: hidden;
        overscroll-behavior: none;
        /* sin zoom por doble toque */
        touch-action: manipulation;
      }
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* los campos de texto (perfil) sí se pueden seleccionar */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>Necesitas activar JavaScript para jugar Touched Block.</noscript>
    <div id="root"></div>
  </body>
